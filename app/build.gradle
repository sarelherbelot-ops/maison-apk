plugins { id 'com.android.application' }
android {
    namespace 'fr.atelier.maison'
    compileSdk 34
    defaultConfig {
        applicationId 'fr.atelier.maison'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Clé fixe : les prochaines mises à jour s'installent par-dessus sans désinstaller
    signingConfigs { fixe { storeFile file('maison.keystore'); storePassword 'maison123'; keyAlias 'maison'; keyPassword 'maison123' } }
    buildTypes {
        debug { signingConfig signingConfigs.fixe }
        release { minifyEnabled false; signingConfig signingConfigs.fixe }
    }
}
